name: open-pr

# Lab helper: creates the landing-phase PR with GITHUB_TOKEN so the PR is authored by
# github-actions[bot] (a principal distinct from the publishing account), which makes a
# live reviewer request possible (GitHub forbids requesting a review from the PR author).
on:
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write

jobs:
  open:
    runs-on: ubuntu-latest
    steps:
      - name: Open PR payload-branch -> main via GITHUB_TOKEN (bot-authored PR)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/parthtests/callee/pulls \
            -f title="Lab PR: innocuous change (commit A, approved state)" \
            -f head="payload-branch" \
            -f base="main" \
            -f body="Lab landing-phase PR. Bot-authored so a live reviewer request can be exercised. Finding #5 validation (OSS VRP Angular)." | tee /tmp/pr.json
          echo "PR_URL=$(jq -r .html_url /tmp/pr.json)"